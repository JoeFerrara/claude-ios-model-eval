<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg3)"/>

  <text x="80" y="55" fill="#ffffff" font-size="28" font-weight="700">Execution Speed</text>
  <text x="80" y="82" fill="#94a3b8" font-size="15">Seconds to generate complete Swift output per test</text>

  <!-- Legend -->
  <rect x="800" y="35" width="16" height="16" rx="3" fill="#f97316"/>
  <text x="824" y="48" fill="#fdba74" font-size="14">Haiku</text>
  <rect x="900" y="35" width="16" height="16" rx="3" fill="#6366f1"/>
  <text x="924" y="48" fill="#a5b4fc" font-size="14">Sonnet</text>
  <rect x="1005" y="35" width="16" height="16" rx="3" fill="#22c55e"/>
  <text x="1029" y="48" fill="#86efac" font-size="14">Opus</text>

  <!-- Horizontal bar chart -->
  <!-- Scale: 900px wide = 342s max, so 1s = 2.63px -->
  <g transform="translate(180, 120)">
    <!-- Test labels on left -->

    <!-- Test 01 -->
    <text x="-15" y="18" fill="#94a3b8" font-size="14" text-anchor="end">01 List</text>
    <rect x="0" y="0" width="34.2" height="14" rx="3" fill="#f97316" opacity="0.85"/>
    <text x="40" y="13" fill="#fdba74" font-size="12">13s</text>
    <rect x="0" y="18" width="55.2" height="14" rx="3" fill="#6366f1" opacity="0.85"/>
    <text x="61" y="31" fill="#a5b4fc" font-size="12">21s</text>
    <rect x="0" y="36" width="50" height="14" rx="3" fill="#22c55e" opacity="0.85"/>
    <text x="56" y="49" fill="#86efac" font-size="12">19s</text>

    <!-- Test 02 -->
    <text x="-15" y="92" fill="#94a3b8" font-size="14" text-anchor="end">02 CRUD</text>
    <rect x="0" y="74" width="118.4" height="14" rx="3" fill="#f97316" opacity="0.85"/>
    <text x="124" y="87" fill="#fdba74" font-size="12">45s</text>
    <rect x="0" y="92" width="299.8" height="14" rx="3" fill="#6366f1" opacity="0.85"/>
    <text x="306" y="105" fill="#a5b4fc" font-size="12">114s</text>
    <rect x="0" y="110" width="76.3" height="14" rx="3" fill="#22c55e" opacity="0.85"/>
    <text x="82" y="123" fill="#86efac" font-size="12">29s</text>

    <!-- Test 03 -->
    <text x="-15" y="166" fill="#94a3b8" font-size="14" text-anchor="end">03 Network</text>
    <rect x="0" y="148" width="105.2" height="14" rx="3" fill="#f97316" opacity="0.85"/>
    <text x="111" y="161" fill="#fdba74" font-size="12">40s</text>
    <rect x="0" y="166" width="349.8" height="14" rx="3" fill="#6366f1" opacity="0.85"/>
    <text x="356" y="179" fill="#a5b4fc" font-size="12">133s</text>
    <rect x="0" y="184" width="110.5" height="14" rx="3" fill="#22c55e" opacity="0.85"/>
    <text x="116" y="197" fill="#86efac" font-size="12">42s</text>

    <!-- Test 04 -->
    <text x="-15" y="240" fill="#94a3b8" font-size="14" text-anchor="end">04 Layout</text>
    <rect x="0" y="222" width="63.1" height="14" rx="3" fill="#f97316" opacity="0.85"/>
    <text x="69" y="235" fill="#fdba74" font-size="12">24s</text>
    <rect x="0" y="240" width="591.8" height="14" rx="3" fill="#6366f1" opacity="0.85"/>
    <text x="598" y="253" fill="#a5b4fc" font-size="12">225s</text>
    <rect x="0" y="258" width="136.8" height="14" rx="3" fill="#22c55e" opacity="0.85"/>
    <text x="143" y="271" fill="#86efac" font-size="12">52s</text>

    <!-- Test 05 -->
    <text x="-15" y="314" fill="#94a3b8" font-size="14" text-anchor="end">05 Combine</text>
    <rect x="0" y="296" width="144.7" height="14" rx="3" fill="#f97316" opacity="0.85"/>
    <text x="151" y="309" fill="#fdba74" font-size="12">55s</text>
    <rect x="0" y="314" width="807.4" height="14" rx="3" fill="#6366f1" opacity="0.85"/>
    <text x="814" y="327" fill="#a5b4fc" font-size="12">307s</text>
    <rect x="0" y="332" width="223.6" height="14" rx="3" fill="#22c55e" opacity="0.85"/>
    <text x="230" y="345" fill="#86efac" font-size="12">85s</text>

    <!-- Test 06 -->
    <text x="-15" y="388" fill="#94a3b8" font-size="14" text-anchor="end">06 Settings</text>
    <rect x="0" y="370" width="78.9" height="14" rx="3" fill="#f97316" opacity="0.85"/>
    <text x="85" y="383" fill="#fdba74" font-size="12">30s</text>
    <rect x="0" y="388" width="899.5" height="14" rx="3" fill="#6366f1" opacity="0.85"/>
    <text x="906" y="401" fill="#a5b4fc" font-size="12">342s</text>
    <rect x="0" y="406" width="170.9" height="14" rx="3" fill="#22c55e" opacity="0.85"/>
    <text x="177" y="419" fill="#86efac" font-size="12">65s</text>
  </g>

  <!-- Annotation -->
  <g transform="translate(80, 570)">
    <rect x="0" y="0" width="1040" height="40" rx="8" fill="#1e1e36" opacity="0.6"/>
    <text x="20" y="26" fill="#94a3b8" font-size="14">Sonnet is 3-11x slower than Haiku on every test. Opus is fast — only 1.5-2x slower than Haiku despite being the most capable model.</text>
  </g>
</svg>
