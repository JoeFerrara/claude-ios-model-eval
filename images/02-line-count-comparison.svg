<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="80" y="55" fill="#ffffff" font-size="28" font-weight="700">Output Size by Model</text>
  <text x="80" y="82" fill="#94a3b8" font-size="15">Lines of Swift code generated per test (fewer = more concise)</text>

  <!-- Legend -->
  <rect x="800" y="35" width="16" height="16" rx="3" fill="#f97316"/>
  <text x="824" y="48" fill="#fdba74" font-size="14">Haiku</text>
  <rect x="900" y="35" width="16" height="16" rx="3" fill="#6366f1"/>
  <text x="924" y="48" fill="#a5b4fc" font-size="14">Sonnet</text>
  <rect x="1005" y="35" width="16" height="16" rx="3" fill="#22c55e"/>
  <text x="1029" y="48" fill="#86efac" font-size="14">Opus</text>

  <!-- Chart area -->
  <g transform="translate(80, 110)">
    <!-- Y axis labels -->
    <text x="-10" y="5" fill="#64748b" font-size="12" text-anchor="end">800</text>
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#1e293b" stroke-width="1"/>

    <text x="-10" y="75" fill="#64748b" font-size="12" text-anchor="end">600</text>
    <line x1="0" y1="70" x2="1040" y2="70" stroke="#1e293b" stroke-width="1"/>

    <text x="-10" y="145" fill="#64748b" font-size="12" text-anchor="end">400</text>
    <line x1="0" y1="140" x2="1040" y2="140" stroke="#1e293b" stroke-width="1"/>

    <text x="-10" y="215" fill="#64748b" font-size="12" text-anchor="end">200</text>
    <line x1="0" y1="210" x2="1040" y2="210" stroke="#1e293b" stroke-width="1"/>

    <text x="-10" y="285" fill="#64748b" font-size="12" text-anchor="end">0</text>
    <line x1="0" y1="280" x2="1040" y2="280" stroke="#334155" stroke-width="1"/>

    <!-- Scale: 280px = 800 lines, so 1 line = 0.35px -->
    <!-- Test 01: Haiku=216, Sonnet=186, Opus=135 -->
    <g transform="translate(30, 0)">
      <rect x="0" y="204.4" width="45" height="75.6" rx="4" fill="#f97316" opacity="0.85"/>
      <text x="22" y="197" fill="#fdba74" font-size="13" text-anchor="middle" font-weight="600">216</text>

      <rect x="50" y="214.9" width="45" height="65.1" rx="4" fill="#6366f1" opacity="0.85"/>
      <text x="72" y="208" fill="#a5b4fc" font-size="13" text-anchor="middle" font-weight="600">186</text>

      <rect x="100" y="232.75" width="45" height="47.25" rx="4" fill="#22c55e" opacity="0.85"/>
      <text x="122" y="226" fill="#86efac" font-size="13" text-anchor="middle" font-weight="600">135</text>

      <text x="72" y="305" fill="#94a3b8" font-size="13" text-anchor="middle">01 List</text>
    </g>

    <!-- Test 02: Haiku=287, Sonnet=291, Opus=240 -->
    <g transform="translate(210, 0)">
      <rect x="0" y="179.55" width="45" height="100.45" rx="4" fill="#f97316" opacity="0.85"/>
      <text x="22" y="173" fill="#fdba74" font-size="13" text-anchor="middle" font-weight="600">287</text>

      <rect x="50" y="178.15" width="45" height="101.85" rx="4" fill="#6366f1" opacity="0.85"/>
      <text x="72" y="171" fill="#a5b4fc" font-size="13" text-anchor="middle" font-weight="600">291</text>

      <rect x="100" y="196" width="45" height="84" rx="4" fill="#22c55e" opacity="0.85"/>
      <text x="122" y="189" fill="#86efac" font-size="13" text-anchor="middle" font-weight="600">240</text>

      <text x="72" y="305" fill="#94a3b8" font-size="13" text-anchor="middle">02 CRUD</text>
    </g>

    <!-- Test 03: Haiku=426, Sonnet=626, Opus=420 -->
    <g transform="translate(390, 0)">
      <rect x="0" y="130.9" width="45" height="149.1" rx="4" fill="#f97316" opacity="0.85"/>
      <text x="22" y="124" fill="#fdba74" font-size="13" text-anchor="middle" font-weight="600">426</text>

      <rect x="50" y="60.9" width="45" height="219.1" rx="4" fill="#6366f1" opacity="0.85"/>
      <text x="72" y="54" fill="#a5b4fc" font-size="13" text-anchor="middle" font-weight="600">626</text>

      <rect x="100" y="133" width="45" height="147" rx="4" fill="#22c55e" opacity="0.85"/>
      <text x="122" y="126" fill="#86efac" font-size="13" text-anchor="middle" font-weight="600">420</text>

      <text x="72" y="305" fill="#94a3b8" font-size="13" text-anchor="middle">03 Network</text>
    </g>

    <!-- Test 04: Haiku=456, Sonnet=486, Opus=404 -->
    <g transform="translate(570, 0)">
      <rect x="0" y="120.4" width="45" height="159.6" rx="4" fill="#f97316" opacity="0.85"/>
      <text x="22" y="114" fill="#fdba74" font-size="13" text-anchor="middle" font-weight="600">456</text>

      <rect x="50" y="109.9" width="45" height="170.1" rx="4" fill="#6366f1" opacity="0.85"/>
      <text x="72" y="103" fill="#a5b4fc" font-size="13" text-anchor="middle" font-weight="600">486</text>

      <rect x="100" y="138.6" width="45" height="141.4" rx="4" fill="#22c55e" opacity="0.85"/>
      <text x="122" y="132" fill="#86efac" font-size="13" text-anchor="middle" font-weight="600">404</text>

      <text x="72" y="305" fill="#94a3b8" font-size="13" text-anchor="middle">04 Layout</text>
    </g>

    <!-- Test 05: Haiku=461, Sonnet=715, Opus=801 -->
    <g transform="translate(750, 0)">
      <rect x="0" y="118.65" width="45" height="161.35" rx="4" fill="#f97316" opacity="0.85"/>
      <text x="22" y="112" fill="#fdba74" font-size="13" text-anchor="middle" font-weight="600">461</text>

      <rect x="50" y="29.75" width="45" height="250.25" rx="4" fill="#6366f1" opacity="0.85"/>
      <text x="72" y="23" fill="#a5b4fc" font-size="13" text-anchor="middle" font-weight="600">715</text>

      <rect x="100" y="-0.35" width="45" height="280.35" rx="4" fill="#22c55e" opacity="0.85"/>
      <text x="122" y="-7" fill="#86efac" font-size="13" text-anchor="middle" font-weight="600">801</text>

      <text x="72" y="305" fill="#94a3b8" font-size="13" text-anchor="middle">05 Combine</text>
    </g>

    <!-- Test 06: Haiku=590, Sonnet=649, Opus=587 -->
    <g transform="translate(930, 0)">
      <rect x="0" y="73.5" width="45" height="206.5" rx="4" fill="#f97316" opacity="0.85"/>
      <text x="22" y="67" fill="#fdba74" font-size="13" text-anchor="middle" font-weight="600">590</text>

      <rect x="50" y="52.85" width="45" height="227.15" rx="4" fill="#6366f1" opacity="0.85"/>
      <text x="72" y="46" fill="#a5b4fc" font-size="13" text-anchor="middle" font-weight="600">649</text>

      <rect x="100" y="74.55" width="45" height="205.45" rx="4" fill="#22c55e" opacity="0.85"/>
      <text x="122" y="68" fill="#86efac" font-size="13" text-anchor="middle" font-weight="600">587</text>

      <text x="72" y="305" fill="#94a3b8" font-size="13" text-anchor="middle">06 Settings</text>
    </g>
  </g>

  <!-- Annotation -->
  <g transform="translate(80, 460)">
    <rect x="0" y="0" width="1040" height="55" rx="8" fill="#1e1e36" opacity="0.6"/>
    <text x="20" y="22" fill="#86efac" font-size="14" font-weight="600">↑ Opus flips on complex tasks</text>
    <text x="20" y="42" fill="#94a3b8" font-size="13">Tests 01-04: Opus is most concise. Tests 05-06: Opus writes MORE code (deeper tests + error handling)</text>
  </g>

  <!-- Footer -->
  <text x="80" y="560" fill="#475569" font-size="13">Claude Model Evaluation · iOS/Swift Code Generation · Lines of output per test prompt</text>
</svg>
