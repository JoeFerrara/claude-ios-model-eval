<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg5)"/>

  <text x="600" y="50" fill="#ffffff" font-size="28" font-weight="700" text-anchor="middle">The Haiku→Opus Pipeline</text>
  <text x="600" y="77" fill="#94a3b8" font-size="15" text-anchor="middle">Draft fast with Haiku, review with Opus. Better results than either model alone.</text>

  <!-- Step 1: Prompt -->
  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="220" height="160" rx="16" fill="#1e1e36" stroke="#334155" stroke-width="1.5"/>
    <text x="110" y="35" fill="#64748b" font-size="12" text-anchor="middle" font-weight="600" letter-spacing="2">STEP 0</text>
    <text x="110" y="65" fill="#ffffff" font-size="20" text-anchor="middle" font-weight="600">Your Prompt</text>
    <text x="110" y="95" fill="#94a3b8" font-size="13" text-anchor="middle">"Build a SwiftUI</text>
    <text x="110" y="113" fill="#94a3b8" font-size="13" text-anchor="middle">settings screen with</text>
    <text x="110" y="131" fill="#94a3b8" font-size="13" text-anchor="middle">validation, photos..."</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="290" y1="220" x2="340" y2="220" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 2: Haiku -->
  <g transform="translate(350, 130)">
    <rect x="0" y="0" width="230" height="180" rx="16" fill="#1e1e36" stroke="#f97316" stroke-width="2"/>
    <rect x="0" y="0" width="230" height="45" rx="16" fill="#f97316" opacity="0.15"/>
    <rect x="0" y="25" width="230" height="20" fill="#f97316" opacity="0.15"/>
    <text x="115" y="30" fill="#f97316" font-size="14" text-anchor="middle" font-weight="700" letter-spacing="1">HAIKU 4.5</text>
    <text x="115" y="72" fill="#ffffff" font-size="18" text-anchor="middle" font-weight="600">Fast Draft</text>
    <text x="115" y="100" fill="#fdba74" font-size="28" text-anchor="middle" font-weight="700">~30s</text>
    <text x="115" y="125" fill="#94a3b8" font-size="13" text-anchor="middle">590 lines</text>
    <text x="115" y="145" fill="#94a3b8" font-size="13" text-anchor="middle">Functional but verbose</text>
    <text x="115" y="165" fill="#64748b" font-size="12" text-anchor="middle">$0.80/$4.00 per 1M tokens</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="590" y1="220" x2="640" y2="220" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="615" y="210" fill="#6366f1" font-size="11" text-anchor="middle">+ review</text>
  <text x="615" y="224" fill="#6366f1" font-size="11" text-anchor="middle">prompt</text>

  <!-- Step 3: Opus Review -->
  <g transform="translate(650, 130)">
    <rect x="0" y="0" width="230" height="180" rx="16" fill="#1e1e36" stroke="#22c55e" stroke-width="2"/>
    <rect x="0" y="0" width="230" height="45" rx="16" fill="#22c55e" opacity="0.15"/>
    <rect x="0" y="25" width="230" height="20" fill="#22c55e" opacity="0.15"/>
    <text x="115" y="30" fill="#22c55e" font-size="14" text-anchor="middle" font-weight="700" letter-spacing="1">OPUS 4.6</text>
    <text x="115" y="72" fill="#ffffff" font-size="18" text-anchor="middle" font-weight="600">Review + Tighten</text>
    <text x="115" y="100" fill="#86efac" font-size="28" text-anchor="middle" font-weight="700">~176s</text>
    <text x="115" y="125" fill="#94a3b8" font-size="13" text-anchor="middle">474 lines (-19%)</text>
    <text x="115" y="145" fill="#94a3b8" font-size="13" text-anchor="middle">Modern APIs, concise</text>
    <text x="115" y="165" fill="#64748b" font-size="12" text-anchor="middle">$15.00/$75.00 per 1M tokens</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="890" y1="220" x2="940" y2="220" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Output -->
  <g transform="translate(950, 140)">
    <rect x="0" y="0" width="190" height="160" rx="16" fill="#22c55e" opacity="0.1" stroke="#22c55e" stroke-width="2"/>
    <text x="95" y="35" fill="#22c55e" font-size="12" text-anchor="middle" font-weight="600" letter-spacing="2">OUTPUT</text>
    <text x="95" y="65" fill="#ffffff" font-size="18" text-anchor="middle" font-weight="600">Tighter than</text>
    <text x="95" y="88" fill="#ffffff" font-size="18" text-anchor="middle" font-weight="600">Opus solo</text>
    <text x="95" y="118" fill="#86efac" font-size="14" text-anchor="middle">5 of 6 tests</text>
    <text x="95" y="140" fill="#94a3b8" font-size="13" text-anchor="middle">14-28% reduction</text>
  </g>

  <!-- VS comparison box at bottom -->
  <g transform="translate(120, 380)">
    <rect x="0" y="0" width="960" height="200" rx="16" fill="#0a0a14" opacity="0.8" stroke="#1e293b" stroke-width="1"/>

    <text x="480" y="35" fill="#ffffff" font-size="18" text-anchor="middle" font-weight="600">Why not just use Opus directly?</text>

    <!-- Opus Solo column -->
    <g transform="translate(80, 60)">
      <rect x="0" y="0" width="370" height="110" rx="12" fill="#1e1e36" stroke="#6366f1" stroke-width="1" opacity="0.6"/>
      <text x="185" y="30" fill="#a5b4fc" font-size="14" text-anchor="middle" font-weight="600">Opus Solo (from scratch)</text>
      <text x="185" y="58" fill="#ffffff" font-size="16" text-anchor="middle">587 lines on Settings test</text>
      <text x="185" y="82" fill="#94a3b8" font-size="13" text-anchor="middle">Builder mode: comprehensive, thorough</text>
      <text x="185" y="100" fill="#94a3b8" font-size="13" text-anchor="middle">Adds extra tests, error handling, defensive code</text>
    </g>

    <!-- Pipeline column -->
    <g transform="translate(510, 60)">
      <rect x="0" y="0" width="370" height="110" rx="12" fill="#1e1e36" stroke="#22c55e" stroke-width="1.5"/>
      <text x="185" y="30" fill="#86efac" font-size="14" text-anchor="middle" font-weight="600">Haiku→Opus Pipeline</text>
      <text x="185" y="58" fill="#ffffff" font-size="16" text-anchor="middle">474 lines on Settings test</text>
      <text x="185" y="82" fill="#94a3b8" font-size="13" text-anchor="middle">Editor mode: tighten, modernize, fix</text>
      <text x="185" y="100" fill="#94a3b8" font-size="13" text-anchor="middle">Constraint of "improve this" produces discipline</text>
    </g>
  </g>
</svg>
