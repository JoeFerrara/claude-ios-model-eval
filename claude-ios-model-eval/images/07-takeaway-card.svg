<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="50%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg7)"/>

  <!-- Subtle border -->
  <rect x="4" y="4" width="1072" height="1072" rx="24" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.3"/>

  <!-- Header -->
  <text x="540" y="90" fill="#6366f1" font-size="16" text-anchor="middle" font-weight="600" letter-spacing="4">MODEL EVALUATION RESULTS</text>

  <text x="540" y="150" fill="#ffffff" font-size="38" text-anchor="middle" font-weight="700">Which Claude Model</text>
  <text x="540" y="195" fill="#ffffff" font-size="38" text-anchor="middle" font-weight="700">Writes the Best iOS Code?</text>

  <rect x="440" y="220" width="200" height="3" fill="#6366f1" rx="2"/>

  <!-- Three cards -->
  <!-- Card 1 -->
  <g transform="translate(65, 265)">
    <rect x="0" y="0" width="950" height="170" rx="16" fill="#1e1e36" stroke="#f97316" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="170" rx="4" fill="#f97316"/>

    <text x="40" y="40" fill="#f97316" font-size="16" font-weight="700">SIMPLE FEATURES</text>
    <text x="40" y="75" fill="#ffffff" font-size="26" font-weight="600">Use Opus directly</text>
    <text x="40" y="110" fill="#94a3b8" font-size="18">37% fewer lines than Haiku on simple tasks.</text>
    <text x="40" y="138" fill="#94a3b8" font-size="18">Fast enough (19-52s). Cleanest code on the first pass.</text>

    <text x="860" y="95" fill="#f97316" font-size="60" font-weight="700" text-anchor="end" opacity="0.2">01</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(65, 465)">
    <rect x="0" y="0" width="950" height="170" rx="16" fill="#1e1e36" stroke="#22c55e" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="170" rx="4" fill="#22c55e"/>

    <text x="40" y="40" fill="#22c55e" font-size="16" font-weight="700">COMPLEX FEATURES</text>
    <text x="40" y="75" fill="#ffffff" font-size="26" font-weight="600">Draft with Haiku, review with Opus</text>
    <text x="40" y="110" fill="#94a3b8" font-size="18">14-28% reduction. Beats Opus solo in 5 of 6 tests.</text>
    <text x="40" y="138" fill="#94a3b8" font-size="18">Different cognitive posture = more disciplined output.</text>

    <text x="860" y="95" fill="#22c55e" font-size="60" font-weight="700" text-anchor="end" opacity="0.2">02</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(65, 665)">
    <rect x="0" y="0" width="950" height="170" rx="16" fill="#1e1e36" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="170" rx="4" fill="#ef4444"/>

    <text x="40" y="40" fill="#ef4444" font-size="16" font-weight="700">CODE GENERATION</text>
    <text x="40" y="75" fill="#ffffff" font-size="26" font-weight="600">Skip Sonnet entirely</text>
    <text x="40" y="110" fill="#94a3b8" font-size="18">Slowest on every test (3-11x slower than Haiku).</text>
    <text x="40" y="138" fill="#94a3b8" font-size="18">Most verbose output. No quality advantage over Haiku.</text>

    <text x="860" y="95" fill="#ef4444" font-size="60" font-weight="700" text-anchor="end" opacity="0.2">03</text>
  </g>

  <!-- Footer -->
  <text x="540" y="910" fill="#64748b" font-size="15" text-anchor="middle">6 iOS/Swift prompts · 3 Claude models · 24 outputs analyzed</text>
  <text x="540" y="938" fill="#64748b" font-size="15" text-anchor="middle">+ Haiku→Opus review pipeline</text>

  <rect x="340" y="965" width="400" height="50" rx="25" fill="#6366f1" opacity="0.15" stroke="#6366f1" stroke-width="1"/>
  <text x="540" y="997" fill="#a5b4fc" font-size="16" text-anchor="middle" font-weight="600">Full results + scripts available</text>
</svg>
