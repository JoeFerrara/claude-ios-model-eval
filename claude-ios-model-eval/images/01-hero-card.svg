<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#fb923c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" rx="0"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#fff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Title -->
  <text x="80" y="100" fill="#ffffff" font-size="44" font-weight="700" letter-spacing="-1">Claude Model Evaluation</text>
  <text x="80" y="145" fill="#a5b4fc" font-size="22" font-weight="400">iOS/Swift Code Generation — 6 Tests × 3 Models + Review Pipeline</text>

  <!-- Divider -->
  <rect x="80" y="170" width="120" height="3" fill="url(#accent)" rx="2"/>

  <!-- Stats row -->
  <g transform="translate(80, 220)">
    <!-- Stat 1 -->
    <text x="0" y="0" fill="#6366f1" font-size="14" font-weight="600" letter-spacing="2" text-transform="uppercase">MODELS TESTED</text>
    <text x="0" y="45" fill="#ffffff" font-size="48" font-weight="700">3</text>
    <text x="55" y="45" fill="#94a3b8" font-size="18">Haiku · Sonnet · Opus</text>

    <!-- Stat 2 -->
    <text x="400" y="0" fill="#6366f1" font-size="14" font-weight="600" letter-spacing="2">TEST PROMPTS</text>
    <text x="400" y="45" fill="#ffffff" font-size="48" font-weight="700">6</text>
    <text x="435" y="45" fill="#94a3b8" font-size="18">Simple → Complex iOS features</text>

    <!-- Stat 3 -->
    <text x="780" y="0" fill="#6366f1" font-size="14" font-weight="600" letter-spacing="2">TOTAL OUTPUTS</text>
    <text x="780" y="45" fill="#ffffff" font-size="48" font-weight="700">24</text>
    <text x="830" y="45" fill="#94a3b8" font-size="18">Raw model outputs analyzed</text>
  </g>

  <!-- Key findings boxes -->
  <g transform="translate(80, 330)">
    <!-- Finding 1 -->
    <rect x="0" y="0" width="320" height="120" rx="12" fill="#1e1e36" stroke="#6366f1" stroke-width="1" opacity="0.8"/>
    <text x="24" y="35" fill="#a5b4fc" font-size="13" font-weight="600" letter-spacing="1.5">FINDING</text>
    <text x="24" y="65" fill="#ffffff" font-size="20" font-weight="600">Opus = most concise</text>
    <text x="24" y="90" fill="#94a3b8" font-size="15">37% fewer lines on simple tasks</text>

    <!-- Finding 2 -->
    <rect x="345" y="0" width="320" height="120" rx="12" fill="#1e1e36" stroke="#f97316" stroke-width="1" opacity="0.8"/>
    <text x="369" y="35" fill="#fdba74" font-size="13" font-weight="600" letter-spacing="1.5">FINDING</text>
    <text x="369" y="65" fill="#ffffff" font-size="20" font-weight="600">Skip Sonnet for code</text>
    <text x="369" y="90" fill="#94a3b8" font-size="15">Slowest + most verbose every test</text>

    <!-- Finding 3 -->
    <rect x="690" y="0" width="430" height="120" rx="12" fill="#1e1e36" stroke="#22c55e" stroke-width="1" opacity="0.8"/>
    <text x="714" y="35" fill="#86efac" font-size="13" font-weight="600" letter-spacing="1.5">KEY FINDING</text>
    <text x="714" y="65" fill="#ffffff" font-size="20" font-weight="600">Haiku→Opus review beats Opus solo</text>
    <text x="714" y="90" fill="#94a3b8" font-size="15">Tighter code in 5 of 6 tests (14-28% reduction)</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="490" width="1200" height="140" fill="#0a0a14" opacity="0.6"/>
  <text x="80" y="545" fill="#64748b" font-size="16">Built with Claude Code CLI · Claude Max subscription · Zero API cost</text>
  <text x="80" y="575" fill="#475569" font-size="14">6 iOS/Swift prompts from SwiftUI lists to full settings screens with validation, PhotosPicker, and Core Data</text>

  <!-- Swift logo hint -->
  <text x="1060" y="555" fill="#f97316" font-size="50" font-weight="700" opacity="0.3">Swift</text>
</svg>
